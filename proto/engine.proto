syntax = "proto3";

package engine.v1;

option go_package = "github.com/fintech/matching-engine/pkg/protocol/v1;enginev1";

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_PARTIALLY_FILLED = 2;
  ORDER_STATUS_FILLED = 3;
  ORDER_STATUS_CANCELED = 4;
  ORDER_STATUS_REJECTED = 5;
}

message SubmitOrderRequest {
  string symbol = 1;
  uint64 order_id = 2;
  Side side = 3;
  OrderType type = 4;
  uint64 price = 5;       // Fixed-point price in micro-units
  uint64 quantity = 6;    // Volume in base units
  TimeInForce tif = 7;
}

message CancelOrderRequest {
  string symbol = 1;
  uint64 order_id = 2;
}

message TradeEvent {
  uint64 maker_order_id = 1;
  uint64 taker_order_id = 2;
  uint64 price = 3;
  uint64 quantity = 4;
  int64 timestamp = 5;
  Side maker_side = 6;
}

message ExecutionReportResponse {
  uint64 order_id = 1;
  string symbol = 2;
  OrderStatus status = 3;
  uint64 leaves_quantity = 4;
  uint64 filled_quantity = 5;
  repeated TradeEvent trades = 6;
  string reject_reason = 7;
  int64 timestamp = 8;
}

message DepthRequest {
  string symbol = 1;
  int32 max_levels = 2;
}

message PriceLevel {
  uint64 price = 1;
  uint64 quantity = 2;
  uint32 order_count = 3;
}

message DepthSnapshotResponse {
  string symbol = 1;
  int64 timestamp = 2;
  repeated PriceLevel bids = 3;
  repeated PriceLevel asks = 4;
}

service MatchingEngineService {
  rpc SubmitOrder(SubmitOrderRequest) returns (ExecutionReportResponse);
  rpc CancelOrder(CancelOrderRequest) returns (ExecutionReportResponse);
  rpc GetMarketDepth(DepthRequest) returns (DepthSnapshotResponse);
  rpc StreamTrades(DepthRequest) returns (stream TradeEvent);
}
